<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
   <title>Estadísticas - Liga Praelium Australis 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #262626;
            color: #ffffff;
            font-family: 'Cardo', serif;
            margin: 0;
            padding: 20px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            text-decoration: none;
            color: white;
        }
        .logo-club { height: 90px; width: auto; }
        .header-text h1 { margin: 0; font-size: 1.8rem; font-weight: 400; }
        .header-text h2 { margin: 2px 0; font-size: 1.3rem; font-weight: 400; color: #E86509; }
        .header-text h3 { margin: 0; font-size: 1.1rem; font-weight: 400; color: #cccccc; }
        
        .boton-volver {
            background-color: #E86509;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 25px;
            transition: 0.2s;
        }
        .boton-volver:hover { background-color: #ff7e23; }

        .mensaje-construccion {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .texto-naranjo {
            color: #E86509;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 12px 0;
        }
        .texto-paciencia {
            color: #ffffff;
            font-size: 1.25rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <a href="index.html" class="header-container">
        <img src="assets/images/logo_PA.png" alt="Logo PA" class="logo-club">
        <div class="header-text">
            <h1>Estadísticas</h1>
            <h2>Liga Interna de Espada Larga 2026</h2>
            <h3>Praelium Australis</h3>
        </div>
    </a>
    <a href="index.html" class="boton-volver">← Volver al Inicio</a>

    <div class="mensaje-construccion">
        <p class="texto-naranjo">Sección en construcción: Se encontrará en funcionamiento a la brevedad</p>
        <p class="texto-paciencia">Paciencia :)</p>
    </div>
</body>
</html>
