<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>GDLPA 2026 - Praelium Australis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #262626;
            color: #ffffff;
            font-family: 'Cardo', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            gap: 20px;
        }

        .logo-club {
            height: 120px;
            width: auto;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-text h1, .header-text h2, .header-text h3 {
            margin: 0;
            font-weight: 400;
        }

        .header-text h1 { font-size: 2rem; }
        .header-text h2 { font-size: 1.8rem; margin-top: 5px; }
        .header-text h3 { font-size: 1.5rem; margin-top: 5px; }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
            gap: 50px;
        }

        .columna-botones {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .imagen-central {
            height: 400px;
            width: auto;
        }

        .boton-nav {
            background-color: #E86509;
            color: #000000;
            text-decoration: none;
            font-family: 'Cardo', serif;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 15px 20px;
            border: 2px solid #E86509;
            border-radius: 5px;
            width: 220px;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s, transform 0.1s;
        }

        .boton-nav:hover {
            background-color: #ff7e23;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                text-align: center;
                gap: 10px;
                margin-top: 25px;
            }
            .main-content {
                flex-direction: column;
                margin-top: 30px;
                margin-bottom: 40px;
                gap: 15px;
                padding: 0 20px;
            }
            .imagen-central {
                order: -1;
                height: 220px;
                margin-bottom: 10px;
            }
            .columna-botones {
                gap: 15px;
                width: 100%;
            }
            .boton-nav {
                width: 100%;
                max-width: 260px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="assets/images/logo_PA.png" alt="Logo Praelium Australis" class="logo-club">
        <div class="header-text">
            <h1>Liga Interna de</h1>
            <h2>Espada Larga 2026</h2>
            <h3>Praelium Australis</h3>
        </div>
    </div>

    <div class="main-content">
        <div class="columna-botones">
            <a href="fixture.html" onclick="this.href='fixture.html?v=' + Date.now()" class="boton-nav">Fixture de Liga</a>
            <a href="./resources/reglamento_liga_2026.pdf" onclick="this.href='./resources/reglamento_liga_2026.pdf?v=' + Date.now()" target="_blank" rel="noopener noreferrer" class="boton-nav">Reglamento</a>
            <a href="estadisticas.html" onclick="this.href='estadisticas.html?v=' + Date.now()" class="boton-nav">Estadísticas</a>
        </div>

        <img src="assets/images/feder_rotada.png" alt="Feder Vertical" class="imagen-central">

        <div class="columna-botones">
            <a href="ranking.html" onclick="this.href='ranking.html?v=' + Date.now()" class="boton-nav">Ranking de Liga</a>
            <a href="fichas_de_duelo.html" onclick="this.href='fichas_de_duelo.html?v=' + Date.now()" class="boton-nav">Fichas de Duelo</a>
            <a href="jueces_arenas.html" onclick="this.href='jueces_arenas.html?v=' + Date.now()" class="boton-nav">Jueces y Arenas</a>
        </div>
    </div>

</body>
</html>
