<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDLPA 2026 - Praelium Australis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #262626;
            color: #ffffff;
            font-family: 'Cardo', serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            gap: 20px;
        }

        .logo-club {
            height: 120px;
            width: auto;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-text h1, .header-text h2, .header-text h3 {
            margin: 0;
            font-weight: 400;
        }

        .header-text h1 { font-size: 2rem; }
        .header-text h2 { font-size: 1.8rem; margin-top: 5px; }
        .header-text h3 { font-size: 1.5rem; margin-top: 5px; }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 60px;
            gap: 50px;
        }

        .imagen-central {
            height: 400px;
            width: auto;
        }

        .boton-nav {
            background-color: #E86509;
            color: #000000;
            text-decoration: none;
            font-family: 'Cardo', serif;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 15px 30px;
            border: 2px solid #E86509;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.1s;
        }

        .boton-nav:hover {
            background-color: #ff7e23;
            transform: scale(1.05);
        }
        @media (max-width: 650px) {
            .header-container {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            .main-content {
                flex-direction: column;
                gap: 20px;
                padding: 0 20px;
            }
            .feder-img {
                height: 220px;
            }
            .boton-liga {
                width: 100%;
                max-width: 260px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="assets/images/logo_PA.png" alt="Logo Praelium Australis" class="logo-club">
        <div class="header-text">
            <h1>Liga Interna de</h1>
            <h2>Espada Larga 2026</h2>
            <h3>Praelium Australis</h3>
        </div>
    </div>

    <div class="main-content">
        <a href="fixture.html" class="boton-nav">Fixture de Liga</a>
        
        <img src="assets/images/feder_rotada.png" alt="Feder Vertical" class="imagen-central">
        
        <a href="ranking.html" class="boton-nav">Ranking de Liga</a>
    </div>

</body>
</html>
